<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak Safe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0fdfa;--bg-grad:linear-gradient(180deg,#f0fdfa 0%,#fff7ed 100%);--fg:#12302e;--card:#ffffff;--pri:#0f766e;--pri-dark:#115e59;--pri-soft:#ccfbf1;--acc:#e06d53;--on:#ffffff;--ln:#cbd5e1;--ok:#166534;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1716;--bg-grad:linear-gradient(180deg,#0b1716 0%,#132423 100%);--fg:#e8f3f1;--card:#142827;--pri:#2dd4bf;--pri-dark:#14b8a6;--pri-soft:#134e4a;--acc:#fb923c;--on:#06201d;--ln:#2a4543;--ok:#86efac;--ok-bg:#064e3b;--bad:#fca5a5;--bad-bg:#7f1d1d}}
:root[data-theme="dark"]{--bg:#0b1716;--bg-grad:linear-gradient(180deg,#0b1716 0%,#132423 100%);--fg:#e8f3f1;--card:#142827;--pri:#2dd4bf;--pri-dark:#14b8a6;--pri-soft:#134e4a;--acc:#fb923c;--on:#06201d;--ln:#2a4543;--ok:#86efac;--ok-bg:#064e3b;--bad:#fca5a5;--bad-bg:#7f1d1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--bg-grad);min-height:100vh;color:var(--fg);font:17px/1.55 "Nunito",sans-serif;transition:background .4s ease}
#app{max-width:740px;margin:auto;padding:18px 16px 48px}
h1,h2,h3{font-family:"Outfit",sans-serif;letter-spacing:-.4px}
h1{font-size:2.5rem;margin:.15em 0 0;background:linear-gradient(135deg,var(--pri),var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:1.38rem;margin:.6em 0 0}h3{font-size:1.22rem;margin:.4em 0}
button{font:700 1rem "Nunito",sans-serif;border:0;border-radius:16px;padding:11px 18px;background:var(--pri);color:var(--on);cursor:pointer;box-shadow:0 4px 0 var(--pri-dark);transition:transform .12s,box-shadow .12s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.05)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--pri-dark)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.ghost{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:0 3px 0 var(--ln)}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
.card,.opt,.n{background:var(--card);color:var(--fg);border:2px solid var(--ln);border-bottom-width:4px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.card{display:flex;gap:14px;align-items:center;width:100%;margin:10px 0}.card em{margin-left:auto;color:var(--ok);font-style:normal;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid .card{flex-direction:column;text-align:center;margin:0;padding:14px}
.pb{height:14px;background:var(--ln);border-radius:99px;overflow:hidden;margin:12px 0;padding:2px}.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:14px;border-top:2px dashed var(--ln)}
.box{background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 6px 16px rgba(15,118,110,.06)}
.n{padding:7px 15px;margin:3px;border-radius:12px}.on{background:var(--pri)!important;color:var(--on)!important;border-color:var(--pri-dark)!important}
.opt{display:block;width:100%;margin:8px 0;padding:13px 16px}.opt:hover:not(:disabled){border-color:var(--pri);transform:translateY(-1px)}
.r{border-color:var(--ok)!important;background:var(--ok-bg)!important;color:var(--fg)!important;animation:pop .35s}
.w{border-color:var(--bad)!important;background:var(--bad-bg)!important;animation:shake .35s}
.ok{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}.sm,.sub{opacity:.85;font-size:.95rem}.badge{font-size:80px;text-align:center;animation:pop .5s}.c{text-align:center}
textarea{width:100%;min-height:58px;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--fg)}
/* Ruta de aprendizaje en Zigzag (Learning Path) */
.path-wrap{position:relative;display:flex;flex-direction:column;gap:18px;padding:14px 0 22px;margin:10px 0}
.path-wrap::before{content:"";position:absolute;top:36px;bottom:36px;left:50%;width:4px;border-left:4px dashed var(--pri);opacity:.35;transform:translateX(-50%);z-index:0}
.path-node{position:relative;z-index:1;width:86%;max-width:460px;padding:14px 16px;border-radius:20px;display:flex;align-items:center;gap:14px;transition:transform .2s}
.path-node:nth-child(odd){align-self:flex-start}
.path-node:nth-child(even){align-self:flex-end}
.path-node:hover{transform:translateY(-3px) scale(1.01);border-color:var(--pri)}
.node-icon{width:54px;height:54px;border-radius:16px;background:var(--pri-soft);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0;border:2px solid var(--pri)}
.path-node.done .node-icon{background:var(--ok-bg);border-color:var(--ok)}
/* Transiciones y Escenas */
.fade-in{animation:fadeIn .32s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scene-wrap{position:relative;border-radius:18px;overflow:hidden;margin:12px 0 16px;border:2px solid var(--ln);border-bottom-width:4px;background:var(--pri-soft);box-shadow:0 6px 16px rgba(0,0,0,.05)}
.scene-svg svg{width:100%;height:auto;max-height:240px;display:block}
.scene-cap{padding:9px 14px;font-size:.92rem;font-weight:700;background:var(--card);border-top:1px solid var(--ln);display:flex;align-items:center;gap:8px}
/* Constructor de frases */
.tray{min-height:66px;border:2px dashed var(--pri);border-radius:16px;padding:12px;background:var(--pri-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.chip{background:var(--card);color:var(--fg);border:2px solid var(--ln);border-bottom-width:4px;border-radius:12px;padding:8px 13px;font-size:.98rem;box-shadow:none}
.chip:hover{border-color:var(--pri);transform:translateY(-2px)}
.chip.in-tray{background:var(--pri);color:var(--on);border-color:var(--pri-dark)}
/* Emparejar columnas */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .opt{min-height:60px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.96rem}
/* Audio, Onda en tiempo real y Feedback de pronunciación */
.audio-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.mic-btn{background:#e11d48;box-shadow:0 4px 0 #9f1239;color:#fff;display:inline-flex;align-items:center;gap:6px}
.mic-btn.rec{animation:pulse 1s infinite;background:#be123c}
.wave-box{display:none;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--pri-soft);border:1px solid var(--pri)}
.wave-box.active{display:flex}
.wave-cv{width:100%;height:38px;display:block}
.w-ok{color:var(--ok);background:var(--ok-bg);padding:2px 6px;border-radius:6px;font-weight:800;display:inline-block;margin:2px}
.w-bad{color:var(--bad);background:var(--bad-bg);padding:2px 6px;border-radius:6px;font-weight:800;text-decoration:underline wavy;display:inline-block;margin:2px}
.hint-box{background:var(--pri-soft);border-left:4px solid var(--pri);padding:10px 14px;border-radius:10px;margin-top:8px;font-size:.94rem}
/* HUD y Mascota */
.hud{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:8px;flex-wrap:wrap}
.pts{background:var(--card);border:2px solid var(--ln);border-bottom-width:3px;border-radius:99px;padding:5px 15px;font-weight:800}
.mas{display:flex;gap:14px;align-items:center;margin:12px 0}.mas svg{width:64px;flex:none}
.bub{background:var(--card);border:2px solid var(--ln);border-bottom-width:4px;border-radius:18px;padding:12px 16px;position:relative;flex:1;font-weight:700}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:9}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.5)}50%{box-shadow:0 0 0 10px rgba(225,29,72,0)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),E=(a,b)=>a.length==b.length&&a.every((x,i)=>x==b[i]);

try{Object.assign(S,JSON.parse(localStorage.getItem("ss")||"{}"))}catch(e){}

}

function guideTour(lang){
  try{speechSynthesis.cancel()}catch(e){}
  const lines = lang==="es" ? [
    "¡Hola! Soy Sunny, tu guía en Speak Safe. Aquí vas a practicar inglés sin miedo a equivocarte.",
    "En el Módulo 1 aprenderás conectores para organizar tus ideas paso a paso.",
    "En el Módulo 2 entrenarás tu oído con audios reales de Valledupar y practicarás tu voz.",
    "En el Módulo 3 trabajarás en grupos seguros con reglas de respeto y tarjetas de conversación.",
    "Y en el Módulo 4 llevarás tu diario de aprendizaje para ver todo tu progreso. ¡Elige una estación y comencemos!"
  ] : [
    "Hi! I am Sunny, your guide in Speak Safe. Here you can practice English without fear of making mistakes.",
    "In Module 1, you will learn connectors to organize your ideas step by step.",
    "In Module 2, you will train your ear with listening activities and practice speaking with your microphone.",
    "In Module 3, you will join Safe Speaking Pods with supportive rules and conversation cards.",
    "And in Module 4, you will track your progress in your personal journal. Choose a station to begin!"
  ];
  let idx=0, ow=$("#sunny");
  function nextLine(){
    if(idx>=lines.length){ow?.classList.remove("speaking");return}
    say2(lines[idx],"happy");
    let u=new SpeechSynthesisUtterance(lines[idx]);
    u.lang=lang==="es"?"es-CO":"en-US";
    u.rate=0.92;
    u.onstart=()=>ow?.classList.add("speaking");
    u.onend=()=>{idx++;nextLine()};
    u.onerror=()=>ow?.classList.remove("speaking");
    speechSynthesis.speak(u);
  }
  nextLine();
}

    ${q[1].map((x,j)=>`<button class=opt onclick=an(${i},${j})>${x}</button>`).join("")}
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
      ${q[4]?`<button class="ghost" style="padding:5px 10px;font-size:.88rem" onclick="$('#h${i}').hidden=!$('#h${i}').hidden;say2('Read the hint carefully! 💡','think')">💡 Need a hint?</button>`:""}
    </div>
    ${q[4]?`<div id=h${i} class=hint-box hidden>${q[4]}</div>`:""}
    <p class=fb></p>
  </div>`).join("")+`<p id=qd class=ok hidden>Well done! You answered every question. ✅</p>`;

const R={
  text:s=>`${sceneBox(s.img,s.cap)}<h3>${s.t}</h3><p>${s.x}</p>`,
  scale:s=>{let a=S[s.k]||[];return `<h3>${s.t}</h3><p>${s.x}</p>`+s.q.map((q,i)=>`<div class=box><p>${i+1}. ${q}</p>${s.k=="post"&&S.pre[i]?`<small>Before (Module 1): <b>${S.pre[i]}/5</b></small><br>`:""}${[1,2,3,4,5].map(n=>`<button class="n${a[i]==n?" on":""}" onclick="sc(this,'${s.k}',${i},${n})">${n}</button>`).join("")}</div>`).join("")+`<p class=ok>There are no right or wrong answers.</p>`},
  cards:s=>`${sceneBox(s.img,s.cap)}<h3>${s.t}</h3><p>${s.x||""}</p><div class=grid>${s.i.map((c,j)=>`<button class=card onclick=cd(${j})><span style="font-size:1.6rem">${c[0]}</span><b>${c[1]}</b></button>`).join("")}</div><div class=box id=dt>Tap a card above to explore 👆</div><p class=sm id=ct>0/${s.i.length} explored</p>`,
  order:s=>(o.p=[...s.s].sort(()=>Math.random()-.5),o.a=[],o.d=0,`${sceneBox(s.img,s.cap)}<h3>${s.t}</h3><p>Tap the blocks below to build the story in the right order. Tap a block in the tray to remove it.</p><div id=od></div>`),
  quiz:s=>(qa=qc=0,`${sceneBox(s.img,s.cap)}<h3>${s.t}</h3>`+qh(s)),
  listen:s=>(qa=qc=0,`${sceneBox(s.img,s.cap)}<h3>${s.t}</h3><div class=box><div class=audio-bar><button onclick=sp(.9)>▶ Listen</button> <button class=ghost onclick=sp(.65)>🐢 Slow</button> <button class=ghost onclick="speechSynthesis.cancel()">■ Stop</button></div><p>${s.lock?"<small>🔒 The transcript unlocks after you answer all questions.</small> ":""}<button class=ghost id=tb ${s.lock?"hidden":""} onclick="$('#tx').hidden=!$('#tx').hidden">📄 Show/Hide transcript</button></p><p id=tx hidden style="background:var(--pri-soft);padding:10px;border-radius:10px">${s.tx}</p></div>`+qh(s)),
  match:s=>(mt={l:null,d:0,r:s.p.map(p=>p[1]).sort(()=>Math.random()-.5)},`<h3>${s.t}</h3><p>${s.x}</p><div class=mt><div>${s.p.map((p,i)=>`<button class=opt id=ml${i} onclick=ml(${i})>${p[0]}</button>`).join("")}</div><div>${mt.r.map((t,k)=>`<button class=opt id=mr${k} onclick=mr(${k})>${t}</button>`).join("")}</div></div>`),
  say:s=>`<h3>${s.t}</h3><p>1. Listen to the model 🔊 &nbsp; 2. Tap <b>🎙️ Speak</b> and say the sentence out loud.</p>`+s.s.map((x,j)=>`<div class=box><p style="margin:0 0 8px"><b>${j+1}.</b> ${x}</p><div class=audio-bar><button onclick="sp(.85,cs().s[${j}])">🔊 Listen</button> <button class=mic-btn id=mic${j} onclick="rec(${j})">🎙️ Speak</button></div><div class=wave-box id=wb${j}><span class=sm style="color:#e11d48;font-weight:800">● REC</span><canvas class=wave-cv id=cv${j} width=300 height=38></canvas></div><div id=sr${j} class=sm style="margin:8px 0 0"></div></div>`).join(""),
  pick:s=>`<h3>${s.t}</h3><p>Choose your focus for this course.</p>`+s.o.map((x,j)=>`<button class="opt${S.goal==x?" r":""}" onclick=pk(${j})>${x}</button>`).join("")+`<p class=ok>${S.goal?"Great goal! 💪":""}</p>`,
  check:s=>`<h3>${s.t}</h3><p>${s.x}</p>`+s.o.map(x=>`<label class=box style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type=checkbox style="width:20px;height:20px" onchange=ck()> <span>${x}</span></label>`).join("")+`<p id=cm class=ok></p>`,
  journal:s=>`<h3>${s.t}</h3><p class=sm>Write a little. Your reflections stay private on your device.</p>`+s.q.map((q,i)=>`<p><b>${q}</b><br><textarea id=j${i} oninput=js(${i})></textarea></p>`).join(""),
  badge:()=>{if(!S.done[cur]){add(50);cf();bp(880)}S.done[cur]=1;sv();let m=M[cur];return `<div class=badge>🏅</div><h3 class=c>${m.b}</h3><p class="ok c">Congratulations! You finished Module ${cur+1}.</p><p class=c>⭐ ${S.pts} points · ${lv()}</p>${cur==3?"<p class=c>You practiced, you listened, you spoke. That is real progress.</p>":""}<p class=c>${cur<3?`<button onclick=go(${cur+1})>Go to Module ${cur+2} →</button> `:""}<button class=ghost onclick=home()>Back to path</button></p>`}
};

function sc(e,k,i,n){let a=S[k]=S[k]||[];a[i]=n;sv();[...e.parentNode.children].forEach(b=>b.classList.toggle("on",b==e))}

function cd(j){
  let s=cs(),n,txt=s.i[j][2].replace(/[“”]/g,"");
  if(!sn[j]){add(2);bp(520)}sn[j]=1;n=Object.keys(sn).length;
  $("#dt").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${s.i[j][1]}</b><button style="padding:5px 10px;font-size:.88rem" onclick="sp(.85,'${txt.replace(/'/g,"\\'")}')">🔊 Hear</button></div><p style="margin:6px 0 0">${s.i[j][2]}</p>`;
  $("#ct").innerHTML=n+"/"+s.i.length+" explored"+(n==s.i.length?" <span class=ok>Great! You explored them all. ✅</span>":"");
}

function ordR(){
  $("#od").innerHTML=`
    <div class=tray>${o.a.map((x,i)=>`<button class="chip in-tray" onclick=ou(${i})>${i+1}. ${x} ✕</button>`).join("")||"<span class=sm>Tap sentence blocks below to place them here in order...</span>"}</div>
    <div class=pool>${o.p.map((x,i)=>`<button class=chip onclick=ot(${i})>+ ${x}</button>`).join("")}</div>
    <button onclick=oc() ${o.p.length?"disabled":""}>Check my sequence</button>
    <p id=of></p>`;
}
const ot=i=>{o.a.push(o.p.splice(i,1)[0]);bp(440);ordR()},ou=i=>{o.p.push(o.a.splice(i,1)[0]);bp(330);ordR()};
function oc(){let r=E(o.a,cs().s);if(r&&!o.d){o.d=1;add(20);setStreak(1);cf();bp(660);say2("Perfect sequence! +20 ⭐","happy")}else if(!r){setStreak(0);bp(220);say2("Check the order of the connectors!","think")}$("#of").innerHTML=r?"<span class=ok>Great job! ✅ Connectors in order: First, Then, Next, After that, Finally.</span>":"<span class=bad>Not quite yet!</span> Tap a blue block in the tray to move it back and reorder."}

function an(i,j){
  let s=cs(),q=s.q[i],b=$("#q"+i).querySelectorAll(".opt");
  if(b[0].disabled)return;
  if(j==q[2]){
    b.forEach((x,k)=>{x.disabled=1;if(k==q[2])x.classList.add("r")});
    $("#q"+i+" .fb").innerHTML=`<span class=ok>✅ Correct!</span> ${q[3]||""}`;
    qc++;qa++;add(10);setStreak(1);bp(660);say2("Great! +10 ⭐","happy");
  }else{
    b[j].disabled=1;b[j].classList.add("w");
    setStreak(0);bp(220);say2("Almost! Try another option 💪","think");
    $("#q"+i+" .fb").innerHTML=`<span class=bad>Not quite.</span> Try another option or tap <b>💡 Need a hint?</b>`;
    return;
  }
  if(qa==s.q.length){
    $("#tb")?.removeAttribute("hidden");
    $("#qd").hidden=false;
    $("#qd").innerHTML=`Score: ${qc}/${s.q.length} ${"⭐".repeat(qc)}<br>Well done! You completed every challenge. ✅`;
    if(qc==s.q.length)cf();
  }
}

function sp(r,t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t||cs().tx);u.lang="en-US";u.rate=r;speechSynthesis.speak(u)}catch(e){alert("Audio is not available on this device.")}}

let _aud={ctx:null,stream:null,raf:null};
function stopWave(j){
  cancelAnimationFrame(_aud.raf);
  if(_aud.stream){_aud.stream.getTracks().forEach(t=>t.stop());_aud.stream=null}
  if(_aud.ctx){_aud.ctx.close().catch(()=>{});_aud.ctx=null}
  $("#wb"+j)?.classList.remove("active");
}

async function startWave(j){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser();
    an.fftSize=64;
    src.connect(an);
    _aud={ctx,stream,raf:null};
    const wb=$("#wb"+j),cv=$("#cv"+j);
    if(!wb||!cv)return;
    wb.classList.add("active");
    const c=cv.getContext("2d"),data=new Uint8Array(an.frequencyBinCount);
    const drawWave=()=>{
      _aud.raf=requestAnimationFrame(drawWave);
      an.getByteFrequencyData(data);
      c.clearRect(0,0,cv.width,cv.height);
      const bars=24,step=Math.floor(data.length/bars),bw=(cv.width/bars)-4;
      for(let i=0;i<bars;i++){
        const val=data[i*step]/255;
        const h=Math.max(4,val*(cv.height-6));
        const y=(cv.height-h)/2;
        c.fillStyle=val>0.45?"#e06d53":"#0f766e";
        c.beginPath();
        c.roundRect(i*(bw+4),y,bw,h,4);
        c.fill();
      }
    };
    drawWave();
  }catch(e){}
}

function rec(j){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const out=$("#sr"+j),btn=$("#mic"+j);
  if(!SR){out.innerHTML="<span class=bad>Voice recognition works best in Chrome or Edge.</span>";return}
  try{
    let r=new SR();r.lang="en-US";r.interimResults=false;
    btn.classList.add("rec");btn.textContent="🎙️ Listening...";
    out.textContent="Speak clearly now...";
    startWave(j);
    r.onresult=e=>{
      let said=e.results[0][0].transcript;
      let rawTarget=cs().s[j].split(/\s+/);
      let cleanWords=said.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/);
      let hits=0;
      let colored=rawTarget.map(orig=>{
        let clean=orig.toLowerCase().replace(/[^a-z]/g,"");
        if(cleanWords.includes(clean)){hits++;return `<span class=w-ok>${orig}</span>`}
        return `<span class=w-bad>${orig}</span>`;
      }).join(" ");
      let pct=Math.round((hits/rawTarget.length)*100);
      if(pct>=75){
        add(10);setStreak(1);bp(660);say2("Awesome pronunciation! +10 ⭐","happy");
        out.innerHTML=`<div style="margin-bottom:6px">${colored}</div><span class=ok>✅ ${pct}% accuracy!</span> <small>(You said: “${said}”)</small>`;
      }else{
        setStreak(0);bp(320);say2("Check the red words and try again! 💪","think");
        out.innerHTML=`<div style="margin-bottom:6px">${colored}</div><span class=bad>⚠️ ${pct}% accuracy.</span> Practice the words in <b style="color:var(--bad)">red</b> and retry! <small>(Heard: “${said}”)</small>`;
      }
    };
    r.onerror=()=>{out.innerHTML="<span class=bad>Could not hear audio. Check microphone permission and try again.</span>"};
    r.onend=()=>{stopWave(j);btn.classList.remove("rec");btn.textContent="🎙️ Speak"};
    r.start();
  }catch(e){stopWave(j);btn.classList.remove("rec");btn.textContent="🎙️ Speak"}
}

function pk(j){S.goal=cs().o[j];sv();draw()}
function ck(){let k=[...document.querySelectorAll("#st input")].every(i=>i.checked);$("#cm").textContent=k?cs().m:"";if(k&&!ck.d){ck.d=1;add(15);cf();bp(660);say2("Challenge completed! +15 ⭐","happy")}}
function jv(){cs().q.forEach((q,i)=>{$("#j"+i).value=S.j[i]||""})}
function js(i){S.j[i]=$("#j"+i).value;sv()}
home();
</script>
