<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Speak Safe</title><style>
:root{--bg:#f4faf9;--fg:#12302e;--card:#fff;--pri:#0f766e;--on:#fff;--ln:#cfe0dd;--ok:#166534;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1c1b;--fg:#e8f3f1;--card:#142827;--pri:#2dd4bf;--on:#06201d;--ln:#2a4543;--ok:#86efac;--bad:#fca5a5}}
:root[data-theme="dark"]{--bg:#0d1c1b;--fg:#e8f3f1;--card:#142827;--pri:#2dd4bf;--on:#06201d;--ln:#2a4543;--ok:#86efac;--bad:#fca5a5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 "Trebuchet MS",Verdana,sans-serif}
#app{max-width:720px;margin:auto;padding:16px}h1{font-size:2.4rem;margin:.3em 0 0}h2{font-size:1.3rem;margin:.6em 0 0}h3{font-size:1.2rem}
button{font:inherit;border:0;border-radius:14px;padding:10px 16px;background:var(--pri);color:var(--on);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}button:disabled{opacity:.4}
.card,.opt,.n{background:var(--card);color:var(--fg);border:2px solid var(--ln);text-align:left}
.card{display:flex;gap:10px;align-items:center;width:100%;margin:8px 0}.big{padding:16px;font-size:1.1rem}.card em{margin-left:auto;color:var(--ok);font-style:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.grid .card{flex-direction:column;text-align:center;margin:0}
.pb{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--pri);transition:width .3s}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.box{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.n{padding:6px 14px;margin:2px}.on{background:var(--pri)!important;color:var(--on)!important}
.opt{display:block;width:100%;margin:5px 0}.opt:disabled{opacity:1}.r{border-color:var(--ok)}.w{border-color:var(--bad)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.sm,.sub{opacity:.8}.badge{font-size:72px;text-align:center}.c{text-align:center}
textarea{width:100%;min-height:48px;font:inherit;padding:8px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--fg)}
</style></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s),E=(a,b)=>a.length==b.length&&a.every((x,i)=>x==b[i]);
let S={done:{},pre:[],post:[],goal:"",j:{}},cur=0,st=0,sn={},qa=0,o={p:[],a:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("ss")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("ss",JSON.stringify(S))}catch(e){}},cs=()=>M[cur].steps[st];
const ST=["I feel nervous when I have to speak English in class.","I am afraid of making mistakes when I speak.","I use a translator when I don’t understand something.","I understand short English audios without Spanish subtitles.","I practice English outside class.","I feel confident organizing my ideas with connectors."],
C=["but","however","although","on the other hand"];
const M=[{t:"Warm-up: route and connectors",ic:"🧭",b:"Explorer",steps:[
{y:"text",t:"Welcome!",x:"Here you can practice English at your own pace. Making mistakes is part of learning.<br><small>Aquí practicas a tu ritmo.</small>"},
{y:"scale",k:"pre",t:"How do I feel about English?",x:"Choose from 1 (never) to 5 (always).",q:ST},
{y:"cards",t:"Connectors help me organize my ideas",x:"Tap each connector to see an example.",i:[["1️⃣","First (sequence)","“First, I wake up early.”"],["2️⃣","Then (sequence)","“Then, I have breakfast.”"],["3️⃣","Next (sequence)","“Next, I go to school.”"],["4️⃣","After that (sequence)","“After that, I study English.”"],["🏁","Finally (sequence)","“Finally, I go to sleep.”"],["↔️","but (contrast)","“I like music, but I can’t sing.”"],["⚠️","however (contrast)","“I want to travel; however, I have no money.”"],["🌧️","although (contrast)","“Although it was raining, we played outside.”"],["⚖️","on the other hand (contrast)","“Some students love speaking; on the other hand, others feel shy.”"]]},
{y:"order",t:"Put the sentences in order",s:["First, I wake up early.","Then, I help my mom at home.","Next, I play soccer with my friends.","After that, I do my homework.","Finally, I watch a movie."]},
{y:"quiz",t:"Choose the right connector",q:[["I like music, ___ I can’t sing.",C,0,"“but” joins two contrasting ideas."],["I want to travel; ___, I have no money.",C,1,"“however” introduces a contrast after a semicolon."],["___ it was raining, we played outside.",C,2,"“Although” starts a sentence with a contrast."],["Some students love speaking; ___, others feel shy.",C,3,"“on the other hand” compares two sides."]]},
{y:"pick",t:"My personal goal",o:["I want to understand more audios.","I want to speak with less fear.","I want to practice every day."]},{y:"badge"}]},
{t:"Listening Lab",ic:"🎧",b:"Active Listener",steps:[
{y:"text",t:"Listen, repeat and answer",x:"You can listen as many times as you want. Level 1 is the easiest."},
{y:"listen",t:"Level 1",tx:"Hi! My name is Carlos. I live in Valledupar. In the morning, I go to school by bike. After school, I play soccer with my friends. On Sundays, I visit my grandmother. I love my city because the people are friendly.",q:[["Where does Carlos live?",["Valledupar","Bogotá","Santa Marta"],0],["How does he go to school?",["By bus","By bike","On foot"],1],["What does he do on Sundays?",["Plays soccer","Visits his grandmother","Goes to school"],1],["Why does he love his city?",["It is big","The people are friendly","It is cold"],1]]},
{y:"listen",t:"Level 2",tx:"Hello, I’m Laura. First, I wake up at six. Then I have breakfast and go to school. I like English, but speaking is difficult for me. However, I practice every day for fifteen minutes. Yesterday, I recorded a voice note and I felt proud. Although I made mistakes, I understood that practice helps.",q:[["What time does Laura wake up?",["Five","Six","Seven"],1],["What is difficult for her?",["Speaking","Reading","Writing"],0],["How long does she practice every day?",["Five minutes","Fifteen minutes","One hour"],1],["How did she feel after recording?",["Proud","Bored","Angry"],0]]},
{y:"listen",t:"Level 3",lock:1,tx:"Good afternoon! Today I want to talk about my school. We don’t have a language room, so we practice in the classroom. Next week, our teacher will bring a speaker and some short audios. On the other hand, the internet in my neighborhood is slow, so I download the audios at school. After that, I listen to them at home. I think small steps help a lot. Finally, I want to speak with more confidence.",q:[["Why don’t they use a language room?",["The school doesn’t have one","It is closed","They don’t like it"],0],["What will the teacher bring?",["A computer","A speaker and short audios","A TV"],1],["What does the student do because the internet is slow?",["Downloads the audios at school","Stops practicing","Uses a translator"],0],["What does the student want?",["To speak with more confidence","To change schools","To stop studying English"],0]]},
{y:"say",t:"Shadowing",s:["I live in Valledupar.","I go to school by bike.","I like English, but speaking is difficult.","First, I wake up at six.","I love my city because the people are friendly."]},{y:"badge"}]},
{t:"Safe Speaking Pods",ic:"🫶",b:"Brave Speaker",steps:[
{y:"cards",t:"Our rules to speak safely",x:"Tap each rule.",i:[["👂","We listen with respect","When someone speaks, we look at them and wait for our turn."],["💛","We do not laugh at mistakes","Everyone is learning. A mistake is a chance to learn."],["➡️","We keep going after a mistake","Take a breath and try again."],["🤝","We help, we don’t correct harshly","Say: “Nice try! You can say it like this.”"]]},
{y:"cards",t:"Roles in the pod",x:"Roles change in each round, so everyone tries every role.",i:[["🎤","Facilitator","Starts the conversation. “Let’s start! Can you tell us about your family?”"],["💬","Speaker","Shares ideas. “I live in Valledupar. I like soccer, but I also like music.”"],["👂","Listener","Listens and gives kind feedback. “I liked your connectors.”"],["⏰","Timekeeper","Keeps turns fair, without pressure. “It’s time to change turns. Thank you!”"]]},
{y:"cards",t:"Phrases that help me",x:"Tap a phrase to see when to use it.",i:[["🔁","Can you repeat, please?","Cuando no escuchaste algo."],["❓","How do you say … in English?","Cuando no sabes una palabra."],["💭","I think…","Para dar tu opinión."],["🔄","Let me try again.","Cuando quieres corregirte sin miedo."]]},
{y:"cards",t:"Pick a card and talk",x:"Choose a topic with your pod.",i:[["👪","My family","Level 1. Starters: “My name is…”, “I like…”, “I live in…”"],["🏘️","My neighborhood","Level 1. Starters: “I live in…”, “There is…”"],["🍲","My favorite food","Level 1. Starters: “I like…”, “It is…”"],["📅","My weekend","Level 2. Use First, Then, Finally."],["📍","A place in Valledupar","Level 2. Use but, however."],["🤔","Study alone or with friends?","Level 3. “Do you prefer studying alone or with friends? Why?” Use although, on the other hand."]]},
{y:"check",t:"My voice-note challenge",x:"Choose one card and record a 30–45 second voice note with your phone. Use at least two connectors.",o:["I used connectors.","I spoke without a translator.","I kept going after a mistake."],m:"Well done! 🎉"},
{y:"text",t:"Two stars and a wish",x:"After each round, give feedback: two things your partner did well and one thing to try next time.<br>⭐ You used “first” and “then”. ⭐ You spoke with confidence. 🌠 Wish: try to speak a little slower."},{y:"badge"}]},
{t:"My Journal",ic:"📓",b:"Reflective Learner",steps:[
{y:"check",t:"Weekly challenge",x:"15 minutes a day. Tick each day when you finish.",o:["Day 1: listen to a Level 1 audio","Day 2: shadow 5 sentences","Day 3: record a 30-second voice note","Day 4: talk with a partner using a card","Day 5: listen to a Level 2 audio","Day 6: retell what you heard","Day 7: reflect"],m:"Great week! 🎉"},
{y:"journal",t:"My journal",q:["What did I practice today?","What was easy?","What was hard?","What mistake helped me learn?","My confidence today (1–5)","My goal for tomorrow"]},
{y:"scale",k:"post",t:"How do I feel now?",x:"Answer again to see your progress.",q:ST},
{y:"quiz",t:"Let’s review!",q:[["Which connector shows contrast?",["First","However","Finally"],1],["I like pizza, ___ I don’t like cheese.",["but","first","then"],0],["Which connector means the last step?",["Next","Although","Finally"],2],["What can you do when you make a mistake while speaking?",["Stop and stay silent","Keep going and try again","Switch to Spanish"],1],["___ it was late, we kept practicing.",["Although","First","Then"],0]]},{y:"badge"}]}];
function home(){cur=0;let d=Object.keys(S.done).length;try{speechSynthesis.cancel()}catch(e){}
$("#app").innerHTML=`<h1>Speak Safe</h1><p class=sub>A safe lab to listen and speak in English</p><div class=pb><i style="width:${d*25}%"></i></div><p class=sm>${d}/4 modules ${M.map((m,i)=>S.done[i]?"🏅 "+m.b:"").join(" ")}</p>${M.map((m,i)=>`<button class="card big" onclick=go(${i})><span>${m.ic}</span><b>Module ${i+1}: ${m.t}</b>${S.done[i]?"<em>✓</em>":""}</button>`).join("")}<p class=sm>Choose a module and go at your own pace.</p>${d==4?"<p class=ok>You are a Safe Speaker! 🎉</p>":""}`}
const go=i=>{cur=i;st=0;draw()},mv=d=>{st+=d;draw();scrollTo(0,0)};
function draw(){let m=M[cur],n=m.steps.length,s=cs();sn={};try{speechSynthesis.cancel()}catch(e){}
$("#app").innerHTML=`<button class=ghost onclick=home()>← Back to menu</button><h2>Module ${cur+1}: ${m.t}</h2><div class=pb><i style="width:${(st+1)/n*100}%"></i></div><div id=st>${R[s.y](s)}</div><div class=nav><button class=ghost onclick=mv(-1) ${st?"":"disabled"}>Back</button><span class=sm>${st+1}/${n}</span><button onclick=mv(1) ${st<n-1?"":"disabled"}>Next</button></div>`;({order:ordR,journal:jv})[s.y]?.()}
const qh=s=>s.q.map((q,i)=>`<div class=box id=q${i}><p><b>${i+1}.</b> ${q[0]}</p>${q[1].map((x,j)=>`<button class=opt onclick=an(${i},${j})>${x}</button>`).join("")}<p class=fb></p></div>`).join("")+`<p id=qd class=ok hidden>Well done! You answered every question. ✅</p>`;
const R={text:s=>`<h3>${s.t}</h3><p>${s.x}</p>`,
scale:s=>{let a=S[s.k]||[];return `<h3>${s.t}</h3><p>${s.x}</p>`+s.q.map((q,i)=>`<div class=box><p>${i+1}. ${q}</p>${s.k=="post"&&S.pre[i]?`<small>Before: ${S.pre[i]}</small><br>`:""}${[1,2,3,4,5].map(n=>`<button class="n${a[i]==n?" on":""}" onclick="sc(this,'${s.k}',${i},${n})">${n}</button>`).join("")}</div>`).join("")+`<p class=ok>There are no right or wrong answers.</p>`},
cards:s=>`<h3>${s.t}</h3><p>${s.x||""}</p><div class=grid>${s.i.map((c,j)=>`<button class=card onclick=cd(${j})><span>${c[0]}</span><b>${c[1]}</b></button>`).join("")}</div><div class=box id=dt>Tap a card 👆</div><p class=sm id=ct>0/${s.i.length} opened</p>`,
order:s=>(o.p=[...s.s].sort(()=>Math.random()-.5),o.a=[],`<h3>${s.t}</h3><p>Tap the sentences in the correct order. Tap an answer to remove it.</p><div id=od></div>`),
quiz:s=>(qa=0,`<h3>${s.t}</h3>`+qh(s)),
listen:s=>(qa=0,`<h3>${s.t}</h3><div class=box><button onclick=sp(.9)>▶ Listen</button> <button class=ghost onclick=sp(.65)>🐢 Slow</button> <button class=ghost onclick="speechSynthesis.cancel()">■ Stop</button><p>${s.lock?"<small>The transcript unlocks after you answer.</small> ":""}<button class=ghost id=tb ${s.lock?"hidden":""} onclick="$('#tx').hidden=!$('#tx').hidden">Show transcript</button></p><p id=tx hidden>${s.tx}</p></div>`+qh(s)),
say:s=>`<h3>${s.t}</h3><p>Listen and repeat. Say each sentence out loud after the audio.</p>`+s.s.map((x,j)=>`<div class=box><button onclick=sp(.8,cs().s[${j}])>🔊</button> ${x}</div>`).join(""),
pick:s=>`<h3>${s.t}</h3><p>Choose one.</p>`+s.o.map((x,j)=>`<button class="opt${S.goal==x?" r":""}" onclick=pk(${j})>${x}</button>`).join("")+`<p class=ok>${S.goal?"Great goal! 💪":""}</p>`,
check:s=>`<h3>${s.t}</h3><p>${s.x}</p>`+s.o.map(x=>`<label class=box style="display:block"><input type=checkbox onchange=ck()> ${x}</label>`).join("")+`<p id=cm class=ok></p>`,
journal:s=>`<h3>${s.t}</h3><p class=sm>Write a little. It stays only on your device.</p>`+s.q.map((q,i)=>`<p><b>${q}</b><br><textarea id=j${i} oninput=js(${i})></textarea></p>`).join(""),
badge:()=>{S.done[cur]=1;sv();let m=M[cur];return `<div class=badge>🏅</div><h3 class=c>${m.b}</h3><p class="ok c">Congratulations! You finished Module ${cur+1}.</p>${cur==3?"<p class=c>You practiced, you listened, you spoke. That is real progress.</p>":""}<p class=c>${cur<3?`<button onclick=go(${cur+1})>Go to Module ${cur+2}</button> `:""}<button class=ghost onclick=home()>Back to menu</button></p>`}};
function sc(e,k,i,n){let a=S[k]=S[k]||[];a[i]=n;sv();[...e.parentNode.children].forEach(b=>b.classList.toggle("on",b==e))}
function cd(j){let s=cs(),n;sn[j]=1;n=Object.keys(sn).length;$("#dt").innerHTML=`<b>${s.i[j][1]}</b><p>${s.i[j][2]}</p>`;$("#ct").innerHTML=n+"/"+s.i.length+" opened"+(n==s.i.length?" <span class=ok>Great! You saw them all. ✅</span>":"")}
function ordR(){$("#od").innerHTML=`<div class=box><b>Your order:</b>${o.a.map((x,i)=>`<button class=opt onclick=ou(${i})>${i+1}. ${x}</button>`).join("")||"<br><small>Empty</small>"}</div><div class=box>${o.p.map((x,i)=>`<button class=opt onclick=ot(${i})>${x}</button>`).join("")}</div><button onclick=oc() ${o.p.length?"disabled":""}>Check my answer</button><p id=of></p>`}
const ot=i=>{o.a.push(o.p.splice(i,1)[0]);ordR()},ou=i=>{o.p.push(o.a.splice(i,1)[0]);ordR()};
function oc(){let r=E(o.a,cs().s);$("#of").innerHTML=r?"<span class=ok>Great job! ✅ Connectors in order: First, Then, Next, After that, Finally.</span>":"<span class=bad>Try again, you can do it!</span> Tap an answer to move it."}
function an(i,j){let s=cs(),q=s.q[i],b=$("#q"+i).querySelectorAll(".opt");if(b[0].disabled)return;b.forEach((x,k)=>{x.disabled=1;if(k==q[2])x.classList.add("r");else if(k==j)x.classList.add("w")});
$("#q"+i+" .fb").innerHTML=(j==q[2]?"<span class=ok>✅ Correct!</span> ":`<span class=bad>Not yet.</span> Correct answer: <b>${q[1][q[2]]}</b>. `)+(q[3]||"");
if(++qa==s.q.length){$("#tb")?.removeAttribute("hidden");$("#qd").hidden=false}}
function sp(r,t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t||cs().tx);u.lang="en-US";u.rate=r;speechSynthesis.speak(u)}catch(e){alert("Audio is not available on this device.")}}
function pk(j){S.goal=cs().o[j];sv();draw()}
function ck(){$("#cm").textContent=[...document.querySelectorAll("#st input")].every(i=>i.checked)?cs().m:""}
function jv(){cs().q.forEach((q,i)=>{$("#j"+i).value=S.j[i]||""})}
function js(i){S.j[i]=$("#j"+i).value;sv()}
home();
</script></body></html>
